<div class="container-fluid py-4 px-4">

  <!-- LOADING -->
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-danger" role="status"></div>
    <p class="mt-3 text-muted">Chargement du plat...</p>
  </div>

  <!-- DETAIL DU PLAT -->
  <div *ngIf="!loading && plat">

    <!-- Bouton retour -->
    <button class="btn btn-outline-danger mb-4" (click)="retour()">
      ← Retour à la liste
    </button>

    <div class="row g-4">

      <!-- Image du plat -->
      <div class="col-md-5">
        <img
          [src]="plat.image || 'https://via.placeholder.com/600x400?text=' + plat.nom"
          class="img-fluid rounded shadow-sm w-100"
          style="max-height: 350px; object-fit: cover;"
          [alt]="plat.nom"
        >
      </div>

      <!-- Informations du plat -->
      <div class="col-md-7">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-header bg-danger text-white">
            <h4 class="mb-0 fw-bold">🍽️ {{ plat.nom }}</h4>
          </div>
          <div class="card-body">

            <!-- Prix -->
            <div class="d-flex align-items-center mb-3">
              <span class="fs-3 fw-bold text-danger me-3">{{ plat.prix | number:'1.2-2' }} TND</span>
              <span class="badge fs-6"
                [class.bg-success]="plat.disponible"
                [class.bg-danger]="!plat.disponible">
                {{ plat.disponible ? '✅ Disponible' : '❌ Indisponible' }}
              </span>
            </div>

            <!-- Catégorie -->
            <div class="mb-3">
              <span class="badge bg-light text-dark border fs-6">
                {{ getCategorieIcone() }} {{ getCategorieNom() }}
              </span>
            </div>

            <!-- Description -->
            <div class="mb-4">
              <h6 class="fw-bold text-muted">Description</h6>
              <p class="text-secondary">
                {{ plat.description || 'Aucune description disponible.' }}
              </p>
            </div>

            <!-- Bouton ajouter au panier -->
            <button
              class="btn btn-danger btn-lg w-100"
              (click)="ajouterAuPanier()"
              [disabled]="!plat.disponible">
              🛒 Ajouter au panier
            </button>

          </div>
        </div>
      </div>

    </div>
  </div>

</div>
